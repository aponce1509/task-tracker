# sources.yaml - what feeds_sync.py reads.
#
#   groups    the news groups; the LLM places each story in exactly one, from
#             its description. Change the groups here, never in the code.
#   news      the outlets: one RSS url per section, the outlet lean and the
#             groups the section usually feeds (a hint, not a rule).
#   follows   the blogs, podcasts, channels and newsletters of the stream.
#
# Lean scale: left | centre-left | centre | centre-right | right | none.
# A story shows its coverage as L / C / R counts: left and centre-left count
# as L, centre-right and right as R, none is left out of the count.
# Basis: global outlets from the AllSides and Media Bias/Fact Check ratings;
# Spanish outlets from the audience self-placement of the Reuters Institute
# Digital News Report (Spain). The leans are a starting point - review them.
#
# Every url below answered with a valid, fresh feed on 2026-10-26. enabled:
# false marks an outlet I want but whose feed did not answer or is stale; find
# its url first. `feeds_sync.py status` shows a feed with 0 items as dead or slow.

# Titles that match one of these regexes (case-insensitive) are never stored:
# generic live blogs, lottery results, horoscopes.
skip_titles:
  - '^última hora'
  - '^últimas noticias'
  - 'en directo: (noticias|última hora|actualidad)'
  - '^comprobar .*resultados'
  - '^(horóscopo|sorteo)'
  - '^(live|watch live)[: ]'

groups:
  politics-spain:
    label: Politics · Spain
    description: Spanish national, regional and municipal politics; government, parties, Congress, courts, elections.
  politics-global:
    label: Politics · Global
    description: International politics, EU institutions, elections abroad, wars, diplomacy, geopolitics.
  macro-central-banks:
    label: Finance · Macro & central banks
    description: Inflation, rates, ECB, Fed, GDP, employment, public debt, fiscal policy, bond markets.
  markets:
    label: Finance · Markets
    description: Stock indexes, the Ibex, sectors, market moves, commodities prices, FX, investor sentiment.
  companies:
    label: Finance · Companies
    description: Company results, deals, mergers, IPOs, strategy, regulation of a single company or sector.
  housing-personal-finance:
    label: Finance · Housing & personal finance
    description: Housing prices and rents, mortgages, pensions, taxes on households, savings, salaries.
  energy:
    label: Finance · Energy
    description: Oil, gas and power prices, the energy transition, utilities, energy policy.
  crypto:
    label: Finance · Crypto
    description: Bitcoin and crypto assets, exchanges, stablecoins, crypto regulation.
  other:
    label: Other
    description: Any story that fits no group above. Stories here are not rendered as notes.

